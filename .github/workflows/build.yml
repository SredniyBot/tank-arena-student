# Проверка на каждый push и pull request: сборка, тесты и самопроверка на Linux и Windows.
# Красная проверка — код с тегом не соберётся и у преподавателя.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Сборка и тесты (Linux)
        if: runner.os != 'Windows'
        run: |
          sh ./mvnw -B verify
          sh ./mvnw -B -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath -Dmdep.outputFile=target/classpath.txt

      - name: Сборка и тесты (Windows)
        if: runner.os == 'Windows'
        run: |
          .\mvnw.cmd -B verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\mvnw.cmd -B -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath "-Dmdep.outputFile=target/classpath.txt"

      - name: Самопроверка (Linux)
        if: runner.os != 'Windows'
        run: java -cp "target/classes:$(cat target/classpath.txt)" student.Main --selfcheck

      - name: Самопроверка (Windows)
        if: runner.os == 'Windows'
        run: java -cp "target\classes;$(Get-Content target\classpath.txt)" student.Main --selfcheck
